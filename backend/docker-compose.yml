services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override the .env (host/local-dev) URLs — inside the compose network,
      # containers reach each other by service name, not localhost.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ragdb
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    depends_on:
      - qdrant
      - redis
      - postgres

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API + dashboard at localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"   # metadata store: documents, sessions, chat history
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  redis_data:
  pg_data:
